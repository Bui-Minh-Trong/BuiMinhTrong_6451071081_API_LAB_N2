global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'slack-notifications'
  routes:
    - match:
        severity: 'critical'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'slack-notifications'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#fb-api-alerts'
        api_url: 'YOUR_SLACK_WEBHOOK_URL'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] Monitoring Alert'
        text: >-
          {{ range .Alerts }}
            *Alert Name:* {{ .Labels.alertname }}
            *Severity:* `{{ .Labels.severity }}`
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Active Since:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ end }}
